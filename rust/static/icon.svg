<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MinDash">
  <title>MinDash</title>
  <!-- A dashboard glyph: one tall panel, two short ones. No background plate, so
       the mark sits correctly on a light or dark browser tab as well as on the
       dark header. The green is the dark-theme accent; it stays legible on white
       rather than washing out. -->
  <rect x="4" y="10" width="18" height="44" rx="6" fill="#22a85c"/>
  <rect x="27" y="10" width="33" height="20" rx="6" fill="#4a4a52"/>
  <rect x="27" y="35" width="33" height="19" rx="6" fill="#8a8a94"/>
</svg>
